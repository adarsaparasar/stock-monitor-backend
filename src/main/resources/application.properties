spring.application.name=stock-monitor
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stock_monitor}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
stock.scheduler.fixed-rate=300000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
alphavantage.api.key=${ALPHAVANTAGE_API_KEY}
alphavantage.api.base-url=https://www.alphavantage.co
logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis.cache=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}